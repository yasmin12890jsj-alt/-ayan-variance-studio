<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7655E8" />
  <title>إيان | AYAN — Variance Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #7655E8;
      --mint: #B9F0DA;
      --peach: #FFE1C7;
      --butter: #FFE995;
      --bg: #F4F1FF;
      --card: #FFFFFF;
      --card-2: #F9F7FF;
      --text: #1B172C;
      --muted: #635D7B;
      --border: #E3DCF9;
      --fav: #0F8A5F;
      --fav-bg: #E0F8EE;
      --unfav: #C62841;
      --unfav-bg: #FFE6EB;
    }

    body.dark {
      --bg: #0F0D1A;
      --card: #19152B;
      --card-2: #221D3A;
      --text: #F5F2FF;
      --muted: #A69FC4;
      --border: #2F284E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 102px;
    }

    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; }

    /* 1. First Screen: Animated Brand Video Reel + Optional intro.mp4 */
    #splashScreen {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, #8E6EFF 0%, #5B38D4 48%, #241559 100%);
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    #introVideoEl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      display: none;
      pointer-events: none;
    }

    .reel-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
      pointer-events: none;
      animation: floatOrb 4.5s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 220px; height: 220px;
      background: rgba(185, 240, 218, 0.18);
      top: -40px; right: -40px;
    }

    .orb-2 {
      width: 260px; height: 260px;
      background: rgba(255, 233, 149, 0.16);
      bottom: -60px; left: -50px;
      animation-delay: 1s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(18px, -16px) scale(1.12); }
    }

    .reel-stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: videoReveal 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes videoReveal {
      0% { opacity: 0; transform: scale(0.84) translateY(18px); filter: blur(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    .splash-logo {
      width: 98px; height: 98px; border-radius: 28px;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.35);
      display: grid; place-items: center;
      font-size: 2.5rem; margin-bottom: 14px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.28);
      animation: pulseBadge 2s infinite ease-in-out;
    }

    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .brand-reel-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #FFFFFF 0%, #FFE995 50%, #B9F0DA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .reel-track {
      width: 190px; height: 5px;
      background: rgba(255,255,255,0.22);
      border-radius: 999px; overflow: hidden; margin-top: 16px;
    }

    .reel-bar {
      width: 55%; height: 100%;
      background: #FFE995; border-radius: 999px;
      animation: sweepBar 1.4s ease-in-out infinite;
    }

    @keyframes sweepBar {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }

    /* 2. Lock */
    #lockScreen { align-items: center; justify-content: center; padding: 18px; }
    .lock-card {
      width: 100%; max-width: 390px; background: var(--card);
      border: 1.5px solid var(--border); border-radius: 22px; padding: 22px; text-align: center;
    }
    .fp-btn {
      width: 78px; height: 78px; border-radius: 50%;
      border: 2.5px solid var(--primary); background: var(--card-2);
      color: var(--primary); font-size: 2.1rem; display: grid; place-items: center;
      margin: 14px auto; cursor: pointer;
    }

    /* 3. Main App */
    #appScreen.active { display: block; }
    .topbar {
      background: linear-gradient(135deg, #6442DC, #8665F5);
      color: #fff; padding: 10px 14px; position: sticky; top: 0; z-index: 200;
    }
    .topbar-inner {
      max-width: 1080px; margin: 0 auto; display: flex;
      justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .top-btns { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }

    .container { max-width: 1080px; margin: 0 auto; padding: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 14px; margin-bottom: 12px;
    }
    .card-title {
      font-size: 0.96rem; font-weight: 900; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (min-width: 680px) { .kpis { grid-template-columns: repeat(5, 1fr); } }
    .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; }
    .kpi-lbl { font-size: 0.72rem; color: var(--muted); font-weight: 800; }
    .kpi-val { font-size: 0.98rem; font-weight: 900; margin-top: 3px; direction: ltr; text-align: right; }

    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 640px) { .grid-2 { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }

    .field { display: flex; flex-direction: column; gap: 3px; }
    .field label { font-size: 0.75rem; font-weight: 800; color: var(--muted); }
    .inp {
      width: 100%; border: 1.5px solid var(--border); background: var(--card-2);
      color: var(--text); border-radius: 11px; padding: 8px 10px;
      font-family: inherit; font-weight: 700; font-size: 0.85rem;
    }

    .btn {
      border: none; border-radius: 11px; padding: 8px 12px; font-family: inherit;
      font-weight: 800; cursor: pointer; font-size: 0.78rem; display: inline-flex;
      align-items: center; justify-content: center; gap: 4px;
    }
    .btn-p { background: var(--primary); color: #fff; }
    .btn-sec { background: var(--card-2); color: var(--text); border: 1.5px solid var(--border); }
    .btn-mint { background: var(--mint); color: #1B172C; }
    .btn-peach { background: var(--peach); color: #1B172C; }
    .btn-butter { background: var(--butter); color: #1B172C; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
    .b-fav { background: var(--fav-bg); color: var(--fav); }
    .b-unfav { background: var(--unfav-bg); color: var(--unfav); }
    .b-info { background: rgba(118,85,232,0.14); color: var(--primary); }

    .panel { display: none; }
    .panel.active { display: block; }

    .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 13px; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; font-size: 0.8rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: start; }
    th { background: var(--card-2); font-weight: 900; }

    .charts-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 820px) { .charts-grid { grid-template-columns: repeat(2, 1fr); } }
    .chart-box { background: var(--card-2); border: 1px solid var(--border); border-radius: 14px; padding: 10px; }

    .ai-box {
      background: var(--card-2); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 12px; line-height: 1.6; font-size: 0.84rem; margin-top: 8px;
    }

    .dock-10 {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
      background: var(--card); border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
      padding: 5px 4px 7px;
    }
    @media (min-width: 820px) { .dock-10 { grid-template-columns: repeat(10, 1fr); } }
    .dock-btn {
      border: none; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 0.64rem; font-weight: 800;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 5px 2px; border-radius: 10px; cursor: pointer;
    }
    .dock-btn .ic { font-size: 1.05rem; line-height: 1; }
    .dock-btn.active { background: rgba(118,85,232,0.18); color: var(--primary); }
  </style>
</head>
<body>

  <!-- 1. First Screen: Animated Brand Video Reel + Optional intro.mp4 -->
  <div id="splashScreen" class="screen active">
    <video id="introVideoEl" autoplay muted playsinline></video>
    <div class="reel-orb orb-1"></div>
    <div class="reel-orb orb-2"></div>

    <div class="reel-stage">
      <div class="splash-logo">🎬</div>
      <div class="brand-reel-title">إيان | AYAN</div>
      <p id="spDesc" style="margin-top:6px; opacity:0.94; font-weight:700;">عرض تعريفي لتطبيق تحليل الفروقات والموازنات</p>
      <div class="reel-track"><div class="reel-bar"></div></div>
      <div style="margin-top:16px;">
        <button class="btn btn-sec" id="spBtn" onclick="goLock()">متابعة إلى البصمة</button>
      </div>
    </div>
  </div>

  <!-- 2. Lock -->
  <div id="lockScreen" class="screen">
    <div class="lock-card">
      <div style="font-size:1.6rem;">🔐</div>
      <h2 id="lkTitle" style="font-size:1.15rem; font-weight:900; margin-top:4px;">قفل البصمة — إيان</h2>

      <div id="lkStatus" style="font-size:0.78rem; font-weight:800; color:var(--unfav); min-height:20px;"></div>
      <input id="pinInput" type="password" class="inp" placeholder="رمز الدخول: AYAN2026" />
